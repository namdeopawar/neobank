apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: neobank-staging

resources:
  - ../../base

namePrefix: staging-

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
    target:
      kind: Deployment
      labelSelector: "tier=backend"

images:
  - name: neobank/auth-service
    newTag: staging
  - name: neobank/account-service
    newTag: staging
  - name: neobank/transaction-service
    newTag: staging
  - name: neobank/frontend
    newTag: staging

commonLabels:
  environment: staging
