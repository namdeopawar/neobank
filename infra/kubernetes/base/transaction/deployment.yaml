apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: neobank
  labels:
    app: transaction-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: transaction-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3003"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: neobank-service-account
      terminationGracePeriodSeconds: 60
      containers:
        - name: transaction-service
          image: neobank/transaction-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3003
          env:
            - name: ENV
              value: production
            - name: PORT
              value: "3003"
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: neobank_transactions
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: ACCOUNT_SERVICE_URL
              value: http://account-service:3002
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3003
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: neobank
  labels:
    app: transaction-service
spec:
  selector:
    app: transaction-service
  ports:
    - port: 3003
      targetPort: 3003
      name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transaction-service-hpa
  namespace: neobank
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transaction-service
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
