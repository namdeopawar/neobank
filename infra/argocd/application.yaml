apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neobank-production
  namespace: argocd
  labels:
    app: neobank
    env: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: deployments
    notifications.argoproj.io/subscribe.on-sync-failed.slack: deployments
    notifications.argoproj.io/subscribe.on-health-degraded.slack: alerts
spec:
  project: neobank
  source:
    repoURL: https://github.com/your-org/neobank.git
    targetRevision: HEAD
    path: infra/kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: neobank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neobank-staging
  namespace: argocd
  labels:
    app: neobank
    env: staging
spec:
  project: neobank
  source:
    repoURL: https://github.com/your-org/neobank.git
    targetRevision: main
    path: infra/kubernetes/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: neobank-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: neobank
  namespace: argocd
spec:
  description: NeoBank Application Project
  sourceRepos:
    - 'https://github.com/your-org/neobank.git'
  destinations:
    - namespace: neobank
      server: https://kubernetes.default.svc
    - namespace: neobank-staging
      server: https://kubernetes.default.svc
    - namespace: neobank-dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
  roles:
    - name: deploy-automation
      description: CI/CD automation role
      policies:
        - p, proj:neobank:deploy-automation, applications, sync, neobank/*, allow
        - p, proj:neobank:deploy-automation, applications, get, neobank/*, allow
      jwtTokens:
        - iat: 1700000000
