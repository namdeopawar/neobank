events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:3001;
        keepalive 32;
    }
    upstream account_service {
        server account-service:3002;
        keepalive 32;
    }
    upstream transaction_service {
        server transaction-service:3003;
        keepalive 32;
    }
    upstream notification_service {
        server notification-service:3004;
        keepalive 32;
    }
    upstream frontend {
        server frontend:80;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;

    log_format json_combined escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":"$status","bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time","upstream_time":"$upstream_response_time"}';

    server {
        listen 80;
        server_name _;
        access_log /var/log/nginx/access.log json_combined;

        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;

        # Auth Service
        location /api/v1/auth {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # Account Service
        location /api/v1/accounts {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 30s;
        }

        # Transaction Service
        location /api/v1/transactions {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 60s;
        }

        # Notification Service
        location /api/v1/notifications {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # Health Check
        location /health {
            return 200 '{"status":"ok","service":"neobank-gateway"}';
            add_header Content-Type application/json;
        }
    }
}
